<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto DPB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f0f0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.13);
      align-items: center;
    }
    .toolbar h1 { font-size: 14px; color: #333; font-weight: 600; margin-right: 8px; }
    button {
      padding: 6px 14px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      color: #333;
    }
    button:hover { background: #e8e8e8; }
    .container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.13);
      overflow: auto;
      max-width: 98vw;
      max-height: 85vh;
      padding: 24px;
    }
    #svg-wrap {
      transform-origin: top left;
      transition: transform 0.18s ease;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Proyecto DPB</h1>
    <button onclick="zoom(1.25)">＋ Ampliar</button>
    <button onclick="zoom(0.8)">－ Reducir</button>
    <button onclick="resetZoom()">↺ Reset</button>
    <button onclick="downloadSVG()">⬇ SVG</button>
  </div>
  <div class="container" id="container">
    <div id="svg-wrap">
